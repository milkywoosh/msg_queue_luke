name: cicdv1-go-rbtmq

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      rollback_to_task_def:
        description: "Task definition revision untuk rollback (kosongkan jika bukan rollback)"
        required: false
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  # ==========================================================
  # JOB 1: CI - jalan di PR maupun push ke master
  # Ini gerbang wajib lolos sebelum PR bisa di-merge
  # (aktifkan sebagai "required status check" di Branch Protection)
  # ==========================================================
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Lint (gofmt & go vet)
        run: |
          gofmt -l . | tee /tmp/gofmt.out
          test ! -s /tmp/gofmt.out
          go vet ./...

      - name: Unit test
        run: go test ./... -short -v

      - name: Run DB migrations
        run: go run ./cmd/migrate
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: testuser
          DB_PASSWORD: testpass
          DB_NAME: testdb

      - name: Integration test
        run: go test ./... -run Integration -v
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: testuser
          DB_PASSWORD: testpass
          DB_NAME: testdb

  # ==========================================================
  # JOB 2: CD - HANYA jalan setelah merge ke master
  # (event push, bukan pull_request) dan HANYA jika lint-test lolos
  # ==========================================================
  build-deploy:
    name: Build, Push & Deploy
    needs: lint-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Render new ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ecs-task-def.json
          container-name: my-app-container
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: my-service
          cluster: my-cluster
          wait-for-service-stability: true

      - name: Smoke test / health check
        id: healthcheck
        run: |
          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.example.com/health)
            if [ "$STATUS" == "200" ]; then
              echo "Health check OK"
              exit 0
            fi
            echo "Health check gagal (status $STATUS), retry $i..."
            sleep 10
          done
          echo "Health check gagal total"
          exit 1

  # ==========================================================
  # JOB 3 (opsional): Auto-rollback jika smoke test gagal
  # ==========================================================
  rollback:
    name: Rollback ke task definition sebelumnya
    needs: build-deploy
    if: failure() && needs.build-deploy.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Rollback service ke revision sebelumnya
        run: |
          PREV_TASK_DEF=$(aws ecs describe-services \
            --cluster my-cluster \
            --services my-service \
            --query "services[0].deployments[?status=='ACTIVE'].taskDefinition" \
            --output text)
          echo "Rollback ke: $PREV_TASK_DEF"
          aws ecs update-service \
            --cluster my-cluster \
            --service my-service \
            --task-definition "$PREV_TASK_DEF"

  # ==========================================================
  # JOB 4 (opsional): Manual rollback via workflow_dispatch
  # Jalankan manual dari tab Actions, isi input rollback_to_task_def
  # ==========================================================
  manual-rollback:
    name: Manual Rollback
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.rollback_to_task_def != ''
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Rollback ke task definition tertentu
        run: |
          aws ecs update-service \
            --cluster my-cluster \
            --service my-service \
            --task-definition "${{ github.event.inputs.rollback_to_task_def }}"
