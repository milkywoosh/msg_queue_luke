name: cicdv1

# ============================================================
# FASE 0: TRIGGER
# - pull_request  -> jalankan CI (fase 1) sebagai syarat merge
# - push ke master   -> jalankan CI lagi + lanjut ke build (fase 2)
# ============================================================
on:
  # baru event pull_request, belum ada push, push baru dilakukan ketika 'allow merge'
  # ketika setelah merge pertama ada push lagi dari branch cicd atau non-branch master, maka akan running CI lagi
  pull_request:
    branches: [master]
  # event 'push' ini dilakukan ketika proses 'allow merge'
  push:
    branches: [master]

jobs:
  # ============================================================
  # FASE 1: CI (Continuous Integration)
  # Jalan di PR maupun push ke master.
  # Ini yang jadi "gerbang" wajib lolos sebelum boleh merge
  # (aktifkan di Settings > Branches > Require status checks:
  #  pilih job "lint-test" sebagai required check)
  # ============================================================
  lint-test:
    name: "Fase 1 - Lint & Test"
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: entry Run Makefile for automate scripts shell
        run: |
          make entry
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          cache: true  
      - name: getin Run Makefile for automate scripts shell
        run: |
          make getin
        
      - name: Lint (gofmt & go vet)
        run: |
          gofmt -l . | tee /tmp/gofmt.out
          test ! -s /tmp/gofmt.out
          go vet ./...

      - name: Unit test (tanpa DB)
        run: go test ./... -short -v

      # - name: Run DB migrations
      #   run: go run ./cmd/migrate
      #   env:
      #     DB_HOST: localhost
      #     DB_PORT: 5432
      #     DB_USER: testuser
      #     DB_PASSWORD: testpass
      #     DB_NAME: testdb

      # - name: Integration test (pakai Postgres)
      #   run: go test ./... -run Integration -v
      #   env:
      #     DB_HOST: localhost
      #     DB_PORT: 5432
      #     DB_USER: testuser
      #     DB_PASSWORD: testpass
      #     DB_NAME: testdb

  # ============================================================
  # FASE 2: BUILD (pengganti sementara "CD", belum ke cloud cloud)
  # HANYA jalan kalau:
  #  - event-nya push (artinya sudah benar-benar merge ke master)
  #  - DAN fase 1 (lint-test) lolos
  #
  # Output-nya: Docker image + binary Go, tersimpan sebagai
  # artifact di GitHub Actions (bisa didownload manual).
  # Nanti ke cloud, tinggal tambah fase 3 (push ke
  # registry) dan fase 4 (deploy) — struktur job ini tidak berubah,
  # tinggal disambung.
  # ============================================================
  build:
    name: "Fase 2 - Build App (Ubuntu 24)"
    needs: lint-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build binary Go
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/app .
        env:
          CGO_ENABLED: 0

      - name: Build Docker image (status hasil build-image belum di-push ke cloud pun)
        run: |
          docker build -t my-app:${{ github.sha }} .
          docker save my-app:${{ github.sha }} -o my-app-image.tar

      - name: Upload binary sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-binary
          path: dist/app
          retention-days: 7

      - name: Upload Docker image sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: my-app-image.tar
          retention-days: 7

      - name: Ringkasan build
        run: |
          echo "Build sukses untuk commit ${{ github.sha }}"
          echo "Binary & Docker image tersedia di tab Artifacts run ini."
          echo "Siap dilanjutkan ke fase deploy (AWS/GCP/VPS/dsb) nanti."
